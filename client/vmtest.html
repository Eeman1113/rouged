<!doctype html>
<html>
<head>

<title>ROUGED viewmodel test</title>
<style>
  body { background: #111114; color: #ddd8cc; font: 12px monospace; margin: 8px; }

</style>

<canvas id="view"></canvas>
<div class="bar" id="weapons"></div>
